version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metal3
      POSTGRES_PASSWORD: metal3
      POSTGRES_DB: metal3_deploy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metal3"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metal3:metal3@postgres:5432/metal3_deploy
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      # Dev convenience only -- overlays the image's baked-in /templates so
      # you can edit a .j2 file and see it without rebuilding. The image
      # itself is self-contained without this (see backend/Dockerfile);
      # a Kubernetes Deployment has nothing to mount this from and doesn't
      # need to -- it just uses what's baked in.
      - ./templates:/templates:ro
      - ${MGMT_KUBECONFIG_HOST_PATH:-./deploy/kubeconfig}:/secrets/kubeconfig:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.deployment_tasks.celery_app", "worker", "--loglevel=INFO"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metal3:metal3@postgres:5432/metal3_deploy
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./templates:/templates:ro
      - ${MGMT_KUBECONFIG_HOST_PATH:-./deploy/kubeconfig}:/secrets/kubeconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
