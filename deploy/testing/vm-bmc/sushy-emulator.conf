# Config for OpenStack sushy-tools' `sushy-emulator` in libvirt-driver
# mode -- this is a real Python config file (loaded via Flask's
# Config.from_pyfile), not INI/YAML.
#
# What this does: sushy-emulator auto-discovers every VM ("domain") that
# already exists on the given libvirt connection and exposes each one as
# a Redfish "System" -- power on/off, boot-device override (PXE vs disk),
# the works. Ironic then manages these virtual "servers" through the
# exact same Redfish calls it would make against a real iDRAC/iLO. This
# is the same approach metal3-io's own CI (metal3-dev-env) uses to test
# the BareMetalHost lifecycle without real hardware.

# `qemu:///system` talks to the local system-wide libvirtd (as opposed to
# `qemu:///session`, a per-user instance -- system-wide is what
# create_test_nodes.py in this directory creates VMs against).
SUSHY_EMULATOR_LIBVIRT_URI = 'qemu:///system'

# Listen on all interfaces so Ironic (running elsewhere -- the management
# cluster, not necessarily this same host) can reach it. Change if
# sushy-emulator runs on a different host than the libvirt VMs themselves
# (it doesn't have to be the same machine, as long as it can reach that
# libvirt socket -- but for this test setup, same host is simplest).
SUSHY_EMULATOR_LISTEN_IP = '0.0.0.0'
SUSHY_EMULATOR_LISTEN_PORT = 8000

# No TLS for this test setup -- bmc_address in create_test_nodes.py's
# output uses redfish:// (not redfish+https://) to match. Do NOT reuse
# this config as-is for anything beyond local testing.
SUSHY_EMULATOR_SSL_CERT = None
SUSHY_EMULATOR_SSL_KEY = None

# HTTP Basic auth sushy-emulator checks on every Redfish call. Point this
# at an htpasswd-format file (README.md shows how to generate one) --
# whatever username/password you put in there is what goes into
# BareMetalHostCreate.credentials when registering these virtual BMCs.
# Leaving this unset disables auth entirely, which sushy-tools supports
# for local testing, but then the credentials you register with the
# backend are irrelevant (Ironic will send *some* credentials, sushy
# just won't check them) -- set this if you want the test to actually
# exercise credential handling, not just power/boot control.
SUSHY_EMULATOR_AUTH_FILE = '/etc/sushy/htpasswd'
