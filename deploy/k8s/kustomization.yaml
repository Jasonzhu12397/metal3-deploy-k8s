apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metal3
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  # secret.yaml is NOT listed here on purpose -- copy secret.yaml.example
  # to secret.yaml (kept out of git), fill in real values, and either add
  # it here or `kubectl apply -f secret.yaml` separately before the rest.
  - deployment-api.yaml
  - deployment-worker.yaml
  # Comment these two out if you already have managed Postgres/Redis --
  # see the caveats at the top of each file.
  - postgres.yaml
  - redis.yaml
