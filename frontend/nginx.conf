server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- any non-file route resolves to index.html so React
    # Router's client-side routes (e.g. /clusters/:id) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API and its WebSocket under the same origin so the
    # browser never needs CORS and VITE_API_BASE_URL can stay empty.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location /readyz {
        proxy_pass http://api:8000/readyz;
    }
}
